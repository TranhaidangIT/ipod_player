workflows:
  ios-unsigned:
    name: iOS Build (Unsigned IPA - AltStore)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build iOS (unsigned - dùng cho AltStore/Sideloadly)
        script: |
          flutter build ios --release --no-codesign
          
      - name: Package thành file IPA
        script: |
          mkdir -p build/ios/ipa
          cd build/ios/Release-iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../ipa/ipod_player.ipa Payload/

    artifacts:
      - build/ios/ipa/ipod_player.ipa

    publishing:
      email:
        recipients:
          - tranhaidang@email.com
        notify:
          success: true
          failure: true
