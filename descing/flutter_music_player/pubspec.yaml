name: classical_music_player
description: A classical music player with iPod/iTunes aesthetic
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.6
  go_router: ^14.0.0

  # State Management
  provider: ^6.1.0

  # Animations
  flutter_animate: ^4.5.0

  # Image Loading
  cached_network_image: ^3.3.1

  # Icons
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
